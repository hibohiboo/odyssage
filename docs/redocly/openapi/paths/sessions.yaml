get:
  summary: セッション一覧取得
  description: |
    公開セッションの一覧を取得するエンドポイント。
    GMがリクエストする場合は、GM IDをクエリパラメータで指定することで、自分の非公開セッションも含めて取得できます。
  operationId: getSessions
  security:
    - bearerAuth: []
  tags:
    - session
  parameters:
    - name: gmId
      in: query
      description: GM ID (指定すると、そのGMのセッションのみを取得)
      required: false
      schema:
        type: string
  responses:
    '200':
      description: セッション一覧取得成功
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/SessionList'
    '401':
      $ref: '../components/schemas/response.yaml#/Unauthorized'
    '500':
      $ref: '../components/schemas/response.yaml#/InternalServerError'
post:
  summary: セッション作成
  description: |
    GMがシナリオを選択して新しいセッションを作成するためのエンドポイント。
    作成したセッションはGMが管理し、参加者を招待できます。
  operationId: createSession
  security:
    - bearerAuth: []
  tags:
    - session
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/session.yaml#/SessionRequest'
  responses:
    '201':
      description: セッション作成成功
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/SessionResponse'
    '400':
      $ref: '../components/schemas/response.yaml#/BadRequestResponse'
    '500':
      $ref: '../components/schemas/response.yaml#/InternalServerError'