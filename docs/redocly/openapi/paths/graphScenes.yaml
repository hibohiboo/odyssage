
put:
  summary: GraphDBシーン作成・更新
  security:
    - bearerAuth: []
  parameters:
    - in: "path"
      name: "id"
      schema:
        type: "string"
      required: true
      description: "シーンID (UUID)"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: "object"
          properties:
            title:
              type: "string"
              description: "シーンタイトル"
              minLength: 1
              maxLength: 100
            overview:
              type: "string"
              description: "シーン概要"
              minLength: 1
              maxLength: 1000
            scenarioId:
              type: "string"
              description: "親シナリオID (UUID)"
              pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            order:
              type: "integer"
              description: "シーン順序 (0以上)"
              minimum: 0
          required:
            - "title"
            - "overview"
            - "scenarioId"
            - "order"
          additionalProperties: false
  responses:
    200:
      description: "シーンが正常に作成または更新されました"
      content:
        application/json:
          schema:
            type: "object"
            properties:
              id:
                type: "string"
                description: "シーンID (UUID)"
              title:
                type: "string"
                description: "シーンタイトル"
              overview:
                type: "string"
                description: "シーン概要"
              scenarioId:
                type: "string"
                description: "親シナリオID (UUID)"
              order:
                type: "integer"
                description: "シーン順序"
            required:
              - "id"
              - "title"
              - "overview"
              - "scenarioId"
              - "order"
            additionalProperties: false
    400:
      $ref: '../components/schemas/response.yaml#/BadRequestResponse'
    401:
      $ref: '../components/schemas/response.yaml#/UnauthorizedResponse'
    500:
      $ref: '../components/schemas/response.yaml#/InternalServerErrorResponse'
  operationId: "upsertGraphScene"
  description: "Neo4jにシーンノードを作成または更新し、親シナリオとの関係性を構築"

delete:
  summary: GraphDBシーン削除
  security:
    - bearerAuth: []
  parameters:
    - in: "path"
      name: "id"
      schema:
        type: "string"
      required: true
      description: "シーンID (UUID)"
  responses:
    204:
      description: "シーンが正常に削除されました"
    400:
      $ref: '../components/schemas/response.yaml#/BadRequestResponse'
    401:
      $ref: '../components/schemas/response.yaml#/UnauthorizedResponse'
    404:
      description: "削除対象のシーンが見つかりません"
      content:
        application/json:
          schema:
            type: "object"
            properties:
              error:
                type: "string"
                example: "Scene not found"
            required:
              - "error"
            additionalProperties: false
    500:
      $ref: '../components/schemas/response.yaml#/InternalServerErrorResponse'
  operationId: "deleteGraphScene"
  description: "Neo4jから指定されたシーンノードとその関係性を削除"