put:
  summary: GraphDBシナリオ作成・更新
  security:
    - bearerAuth: []
  parameters:
    - in: "path"
      name: "id"
      schema:
        type: "string"
      required: true
      description: "シナリオID (UUID)"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: "object"
          properties:
            title:
              type: "string"
              description: "シナリオタイトル（冗長データ）"
              minLength: 1
              maxLength: 100
            overview:
              type: "string"
              description: "シナリオ概要（冗長データ）"
              minLength: 1
              maxLength: 1000
          required:
            - "title"
            - "overview"
          additionalProperties: false
  responses:
    200:
      description: "シナリオが正常に更新されました"
      content:
        application/json:
          schema:
            type: "object"
            properties:
              id:
                type: "string"
                description: "シナリオID (UUID)"
              title:
                type: "string"
                description: "シナリオタイトル"
              overview:
                type: "string"
                description: "シナリオ概要"
            required:
              - "id"
              - "title"
              - "overview"
            additionalProperties: false
    201:
      description: "シナリオが正常に作成されました"
      content:
        application/json:
          schema:
            type: "object"
            properties:
              id:
                type: "string"
                description: "シナリオID (UUID)"
              title:
                type: "string"
                description: "シナリオタイトル"
              overview:
                type: "string"
                description: "シナリオ概要"
            required:
              - "id"
              - "title"
              - "overview"
            additionalProperties: false
    400:
      $ref: '../components/schemas/response.yaml#/BadRequestResponse'
    401:
      $ref: '../components/schemas/response.yaml#/UnauthorizedResponse'
    500:
      $ref: '../components/schemas/response.yaml#/InternalServerErrorResponse'
  operationId: "upsertGraphScenario"
  description: "Neo4jにシナリオノードを作成または更新（RDBでの作成・更新後に呼び出し）"