parameters:
  - name: id
    in: path
    description: 取得するセッションのID
    required: true
    schema:
      type: string
      format: uuid

get:
  summary: セッション取得
  description: |
    特定のセッションの詳細情報を取得します。
    セッションのタイトル、ステータス、関連するシナリオ情報などが含まれます。
  operationId: getSession
  security:
    - bearerAuth: []
  tags:
    - session
  responses:
    '200':
      description: セッション取得成功
      content:
        application/json:
          schema:
            $ref: '../components/schemas/session.yaml#/Session'
    '404':
      $ref: '../components/schemas/response.yaml#/NotFound'
    '500':
      $ref: '../components/schemas/response.yaml#/InternalServerError'