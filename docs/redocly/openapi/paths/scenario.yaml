get:
  summary: シナリオ取得 (非推奨)
  operationId: "getScenarioById"
  deprecated: true
  description: |
    **⚠️ 非推奨**: このエンドポイントは非推奨です。
    
    新しいエンドポイント `GET /api/scenarios/{id}` を使用してください。
    RESTful命名統一のため、単数形から複数形に変更されました。
    
    **移行期間**: 2025年11月まで（3ヶ月間）
    **新エンドポイント**: `/api/scenarios/{id}`
  parameters:
    - in: "path"
      name: "id"
      schema:
        type: "string"
        format: "uuid"
      required: true
      description: "取得するシナリオのUUID"
  responses:
    200:
      description: "シナリオの詳細情報を正常に取得"
      content:
        application/json:
          schema:
            type: "object"
            properties:
              id:
                type: "string"
                format: "uuid"
                description: "シナリオのUUID"
              title:
                type: "string"
                description: "シナリオタイトル"
              overview:
                type: "string"
                description: "シナリオ概要"
              visibility:
                type: "string"
                enum: ["public", "private"]
                description: "公開設定"
              updatedAt:
                type: "string"
                format: "date-time"
                description: "最終更新日時"
            required:
              - "id"
              - "title"
              - "overview"
              - "visibility"
              - "updatedAt"
            additionalProperties: false
    400:
      $ref: '../components/schemas/response.yaml#/BadRequestResponse'
    404:
      description: "指定されたシナリオが存在しない"
      content:
        text/plain:
          schema:
            type: "string"
            example: "Not Found"