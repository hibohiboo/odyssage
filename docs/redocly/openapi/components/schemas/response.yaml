BadRequestResponse:
  description: "不正なリクエスト"
  content:
    application/json:
      schema:
        type: "object"
        properties:
          error:
            type: "string"
        required:
          - "error"

Unauthorized:
  description: "認証エラー"
  content:
    application/json:
      schema:
        type: "object"
        properties:
          error:
            type: "string"
            example: "認証が必要です"
        required:
          - "error"

